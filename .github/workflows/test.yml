name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check src script test

      - name: Check storage slot constants
        run: python3 script/check-storage-slots.py

      - name: Run Forge build
        run: forge build

      - name: Run Forge tests
        run: forge test -vvv

      - name: Check indexer venue ABIs are current
        run: ./script/export-venue-abi.sh --check

  anvil-e2e:
    name: Anvil E2E
    runs-on: ubuntu-latest
    env:
      RPC: http://127.0.0.1:8545
      # anvil default account 0 (public test key): deployer, admin and bundler
      DEPLOYER_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Start anvil
        run: |
          anvil --chain-id 31337 --hardfork prague --silent &
          for i in $(seq 1 30); do cast chain-id --rpc-url "$RPC" >/dev/null 2>&1 && exit 0; sleep 1; done
          echo "anvil did not start" && exit 1

      - name: Deploy all contracts
        run: |
          forge script script/deploy-contract/DeployAll.s.sol:DeployAllScript \
            --rpc-url "$RPC" --private-key "$DEPLOYER_KEY" --broadcast --slow

      - name: Run ERC-4337 smoke test
        # handleOps needs headroom over eth_estimateGas (EntryPoint inner-call gas checks)
        # pipefail: forge exits non-zero when a broadcast transaction fails on chain, even after
        # the simulation printed SMOKE OK
        run: |
          set -o pipefail
          forge script script/e2e/AnvilSmoke.s.sol:AnvilSmokeScript \
            --rpc-url "$RPC" --private-key "$DEPLOYER_KEY" --broadcast --slow --gas-estimate-multiplier 200 \
            | tee smoke.log
          grep -q "SMOKE OK" smoke.log

  platform-compatibility:
    name: Platform compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contracts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: poc-contract
          persist-credentials: false
          submodules: recursive

      - name: Checkout platform
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: 0xmhha/poc-platform
          path: poc-platform
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Build contract artifacts
        working-directory: poc-contract
        run: forge build

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: poc-platform/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: poc-platform/pnpm-lock.yaml

      - name: Install platform dependencies
        working-directory: poc-platform
        run: pnpm install --frozen-lockfile

      - name: Sync current contract interface into platform
        working-directory: poc-platform
        run: pnpm contracts:sync

      - name: Verify platform consumers compile
        working-directory: poc-platform
        run: pnpm typecheck
